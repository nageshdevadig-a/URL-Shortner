  {% load static %}
  
  <!-- Sign-Up Modal -->
  <div class="modal fade" id="signUpModal" tabindex="-1" aria-labelledby="signUpModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(to right, #001A6E, #074799);color: #fff;">
                <h5 style="font-weight: 1000;" class="modal-title fw-bolder" id="signUpModalLabel">Create you new account!</h5>
                <button style="background-color: #fff;" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="signUpForm">
                    
                    <div class="mb-3">
                        <label style="margin-right: 80%;font-weight: bold;" for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" id="su-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">
                        <label style="margin-right: 80%;font-weight: bold;" for="email" class="form-label">Email ID</label>
                        <input type="email" name="email" class="form-control" id="su-email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label style="margin-right: 80%;font-weight: bold;" for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="su-password" placeholder="Enter your password" required>
                    </div>
                    <div id="su-error-message" class="error-text">
                        Email id already exist!
                    </div>
                    <button type="submit" class="btn btn-cl w-100">Sign Up</button>
                </form>
            </div>
            <div class="modal-footer">
                <small class="text-muted a">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</small>
            </div>
        </div>
    </div>
</div>

<script src="{% static '/javascript/signup.js' %}"></script>
