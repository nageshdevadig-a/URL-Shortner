{% load static %}

<!-- Sign-In Modal -->
<div class="modal fade" id="signInModal" tabindex="-1" aria-labelledby="signUpModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content shadow">
            <div class="modal-header" style="background: linear-gradient(to right, #001A6E, #074799);color: #fff;">
                <h5 style="font-weight: 1000;" class="modal-title fw-bolder" id="signUpModalLabel">Sign in to access
                    Dashboard!</h5>
                <button style="background-color: #fff;" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="signInForm">
                    
                    <div class="mb-3">
                        <label style="margin-right: 80%;font-weight: bold;" for="email" class="form-label">Email
                            ID</label>
                        <input type="email" name="email" class="form-control" id="si-email"
                            placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label style="margin-right: 80%;font-weight: bold;" for="password"
                            class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="si-password"
                            placeholder="Enter your password" required>
                    </div>
                    <div id="si-error-message" class="error-text">Email ID or password doesn't match. Please try again.
                    </div>
                    <button type="submit" class="btn btn-cl w-100">Sign In</button>
                </form>
            </div>
            <div class="modal-footer">
                <small class="text-muted">Don't have account?<button
                        style=" text-decoration: underline;border: none; background: none;"
                        type="button" class="header-buttnSU a" data-bs-toggle="modal" data-bs-target="#signUpModal">create
                        account</button> </br>By continuing, you agree to our <a href="#">Terms of Service</a> and <a
                        href="#">Privacy Policy</a>.</small>
            </div>
        </div>
    </div>
</div>

<script src="{% static '/javascript/signin.js' %}"></script>
